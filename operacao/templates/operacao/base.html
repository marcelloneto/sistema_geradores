{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Operações - OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f6f9; }
        .erp-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #e9ecef; }
    </style>
</head>
<body>

<div class="container-fluid">
    <!-- Cabeçalho Principal -->
    <div class="row border-bottom p-3 bg-white d-flex justify-content-between align-items-center">
        <div class="col">
            <h4 class="mb-0 text-primary">
                <i class="bi bi-folder2-open me-2"></i> Gestão de Ordens de Serviço
            </h4>
        </div>
        <div class="col-auto">
            <!-- Botão para voltar/carregar a Lista Geral de OS -->
            <a href="{% url 'listagem:home' %}" class="btn btn-outline-primary me-2">
                <i class="bi bi-list-task"></i> Lista de OS
            </a>
            
            <a href="{% url 'operacao:nova_os' %}" class="btn btn-primary me-2">
                <i class="bi bi-plus-lg"></i> Nova OS
            </a>
            
            <a href="{% url 'portal:home' %}" class="btn btn-outline-secondary">
                <i class="bi bi-house"></i> Voltar ao Portal
            </a>
        </div>
    </div>

    <!-- Conteúdo Dinâmico -->
    <div class="p-4">
        {% block content %}
        {% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script Global de Travar/Destravar Edição -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const formEditavel = document.querySelector('.form-editavel');
        if (!formEditavel) return;

        const inputs = formEditavel.querySelectorAll('input, select, textarea');
        const botoesSalvar = document.querySelectorAll('.btn-salvar');
        const botoesEditar = document.querySelectorAll('.btn-editar');
        const botoesCancelar = document.querySelectorAll('.btn-cancelar'); 

        function travarFormulario() {
            inputs.forEach(input => {
                if (input.name !== 'csrfmiddlewaretoken' && input.type !== 'hidden') {
                    input.disabled = true;
                }
            });
            botoesSalvar.forEach(btn => btn.style.display = 'none');
            botoesCancelar.forEach(btn => btn.style.display = 'none');
            botoesEditar.forEach(btn => btn.style.display = 'inline-block');
        }

        function destravarFormulario() {
            inputs.forEach(input => {
                if (input.name !== 'csrfmiddlewaretoken' && input.type !== 'hidden') {
                    input.disabled = false;
                }
            });
            botoesSalvar.forEach(btn => btn.style.display = 'inline-block');
            botoesCancelar.forEach(btn => btn.style.display = 'inline-block');
            botoesEditar.forEach(btn => btn.style.display = 'none');
        }

        travarFormulario();

        botoesEditar.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                destravarFormulario();
            });
        });

        botoesCancelar.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                formEditavel.reset(); 
                travarFormulario();   
            });
        });
    });
</script>

</body>
</html>
