<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Ensaio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container" style="max-width: 600px; margin-top: 50px;">
    <div class="card p-4 border-danger shadow-sm">
        <h3 class="text-danger">Confirmar Exclusão</h3>
        <p>Tem certeza que deseja excluir o ensaio <strong>{{ object.tipo_ensaio.nome }}</strong> da OS <strong>{{ object.ordem_servico.numero }}</strong>?</p>
        <p class="text-muted small">Esta ação não poderá ser desfeita.</p>
        
        <form method="post" class="mt-4 text-end">
            {% csrf_token %}
            <a href="{% url 'ensaios:lista' %}" class="btn btn-outline-secondary me-2">Cancelar</a>
            <button type="submit" class="btn btn-danger">Sim, Excluir</button>
        </form>
    </div>
</div>
</body>
</html>
